# Chronicle ingestion — twice daily at 00:30 and 12:30 UTC (6:00 / 18:00 IST).
# Secrets required in Settings → Secrets and variables → Actions:
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
#   GROQ_API_KEY, GROQ_MODEL_FAST
# Optional repository variable: INGEST_MAX_NEW (defaults to 25 in code).
name: Ingest

on:
  schedule:
    - cron: "30 0 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ingestion
        run: npm run ingest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL_FAST: ${{ secrets.GROQ_MODEL_FAST }}
          INGEST_MAX_NEW: ${{ vars.INGEST_MAX_NEW || '25' }}
